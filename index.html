<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#04150F" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <title>Mualim Ul Furqan · Live One-on-One Online Quran Classes</title>
    <meta
      name="description"
      content="Live one-on-one Noorani Qaida, Nazra, Tajweed, Hifz and Duas classes for kids and adults in the UK, US and Europe. Same teacher every week. First class free."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Mualim Ul Furqan" />
    <meta property="og:title" content="Mualim Ul Furqan · Online Quran Classes" />
    <meta
      property="og:description"
      content="Quran lessons your child will look forward to. Live one-on-one on Google Meet. First class free."
    />
    <!-- Share card: made absolute from VITE_SITE_URL by siteUrlInHtml (vite.config.ts); source in scripts/og-image/ -->
    <meta property="og:image" content="%SITE_URL%/og.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Mualim Ul Furqan: live one-on-one Quran classes for kids and adults. Noorani Qaida, Nazra, Tajweed and Duas. First class free."
    />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- The logo uses A Thuluth: fetch it early so the wordmark does not swap fonts after first paint. -->
    <link rel="preload" href="/fonts/a-thuluth.ttf" as="font" type="font/ttf" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Amiri+Quran&family=Aref+Ruqaa:wght@400;700&family=Manrope:wght@400..800&family=Outfit:wght@500..800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
    />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebSite",
            "@id": "%SITE_URL%/#website",
            "url": "%SITE_URL%/",
            "name": "Mualim Ul Furqan",
            "alternateName": ["معلم الفرقان", "Mualim ul Furqan Online Quran Academy"],
            "publisher": { "@id": "%SITE_URL%/#academy" }
          },
          {
            "@type": "EducationalOrganization",
            "@id": "%SITE_URL%/#academy",
            "name": "Mualim Ul Furqan",
            "alternateName": "مُعَلِّمُ الْفُرْقَان",
            "url": "%SITE_URL%/",
            "image": "%SITE_URL%/og.jpg",
            "email": "mualimulfurqan@gmail.com",
            "description": "Live one-on-one online Quran classes: Noorani Qaida, Nazra, Tajweed, Hifz and Duas.",
            "areaServed": ["GB", "US", "EU"]
          }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

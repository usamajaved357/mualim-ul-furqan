<!doctype html>
<!--
  Open Graph / social share card, 1200×630. Rendered to public/og.jpg by `npm run og:render`.
  Colours mirror the @theme tokens in src/styles/globals.css; copy mirrors index.html and src/config/site.ts.
  Only state what the site already claims: no ratings, counts or testimonials here.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Marhey:wght@700&family=Plus+Jakarta+Sans:wght@600;700;800&display=block"
    />
    <style>
      :root {
        --night: #0a2a24;
        --night-2: #11332c;
        --night-3: #1b4a40;
        --deep: #061a16;
        --brand: #0b5d4b;
        --gold: #e8cf94;
        --gold-deep: #c9a24b;
        --cream: #f6f1e6;
        --mist: #bcc9c3;
      }
      * {
        box-sizing: border-box;
        margin: 0;
      }
      html,
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
      }
      body {
        position: relative;
        background:
          radial-gradient(circle at 80% 46%, rgb(11 93 75 / 0.75) 0%, transparent 52%),
          radial-gradient(circle at 0% 100%, var(--deep) 0%, transparent 60%), var(--night);
        color: var(--cream);
        font-family: 'Plus Jakarta Sans', sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .pattern {
        position: absolute;
        inset: 0;
      }
      .card {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: space-between;
        height: 100%;
        padding: 64px 72px;
      }
      .copy {
        display: flex;
        flex-direction: column;
        gap: 30px;
        width: 640px;
      }
      .eyebrow {
        display: flex;
        align-items: center;
        gap: 16px;
        color: var(--gold);
        font-size: 19px;
        font-weight: 800;
        letter-spacing: 0.2em;
        text-transform: uppercase;
      }
      h1 {
        font-size: 66px;
        font-weight: 800;
        line-height: 1.06;
        letter-spacing: -0.035em;
      }
      h1 em {
        color: var(--gold);
        font-style: normal;
      }
      .courses {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        padding: 0;
        list-style: none;
      }
      .courses li {
        padding: 8px 16px;
        border: 2px solid rgb(232 207 148 / 0.45);
        border-radius: 999px;
        color: var(--cream);
        font-size: 22px;
        font-weight: 700;
      }
      .offer {
        display: flex;
        align-items: center;
        gap: 22px;
      }
      .free {
        padding: 13px 26px;
        border-radius: 999px;
        background: var(--gold);
        color: var(--night);
        font-size: 26px;
        font-weight: 800;
      }
      .where {
        color: var(--mist);
        font-size: 22px;
        font-weight: 600;
      }
      .emblem {
        position: relative;
        display: grid;
        place-items: center;
        align-self: flex-end;
        width: 380px;
        height: 480px;
        margin-bottom: -64px;
      }
      .emblem svg {
        position: absolute;
        inset: 0;
      }
      .emblem .name {
        position: relative;
        margin-top: 34px;
        color: var(--gold);
        font-family: 'Marhey', serif;
        font-size: 50px;
        font-weight: 700;
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <svg class="pattern" width="1200" height="630" aria-hidden="true">
      <defs>
        <pattern id="girih" width="80" height="80" patternUnits="userSpaceOnUse">
          <g fill="none" stroke="#E8CF94" stroke-opacity="0.09" stroke-width="1">
            <rect x="22" y="22" width="36" height="36" />
            <polygon points="40,14.5 65.5,40 40,65.5 14.5,40" />
            <path d="M0 0L14.5 14.5M80 0L65.5 14.5M0 80L14.5 65.5M80 80L65.5 65.5" />
          </g>
        </pattern>
      </defs>
      <rect width="1200" height="630" fill="url(#girih)" />
      <g transform="translate(934 315)" fill="none" stroke="#E8CF94" stroke-opacity="0.16" stroke-width="1.2">
        <circle r="300" />
        <rect x="-212" y="-212" width="424" height="424" />
        <rect x="-212" y="-212" width="424" height="424" transform="rotate(22.5)" />
        <rect x="-212" y="-212" width="424" height="424" transform="rotate(45)" />
        <rect x="-212" y="-212" width="424" height="424" transform="rotate(67.5)" />
        <circle r="150" />
      </g>
    </svg>

    <main class="card">
      <div class="copy">
        <p class="eyebrow">
          <svg viewBox="0 0 64 64" width="44" height="44" aria-hidden="true">
            <path d="M8 62V30C8 17 21 9 32 2C43 9 56 17 56 30V62Z" fill="#0B5D4B" />
            <path
              d="M13 58V31C13 21 23 14 32 8.5C41 14 51 21 51 31V58Z"
              fill="none"
              stroke="#E8CF94"
              stroke-width="2"
            />
            <path
              d="M32 17l1.6 3.4 3.7.5-2.7 2.6.7 3.7L32 25.5l-3.3 1.7.7-3.7-2.7-2.6 3.7-.5z"
              fill="#E8CF94"
            />
            <path
              d="M18 40C24 36.5 29 36.5 32 39.5C35 36.5 40 36.5 46 40V51C40 47.5 35 47.5 32 50.5C29 47.5 24 47.5 18 51Z"
              fill="#E8CF94"
            />
          </svg>
          Mualim Ul Furqan
        </p>
        <h1>Live one-on-one <em>Quran classes</em> for kids &amp; adults</h1>
        <ul class="courses">
          <li>Noorani Qaida</li>
          <li>Nazra</li>
          <li>Tajweed</li>
          <li>Hifz</li>
          <li>Duas</li>
        </ul>
        <div class="offer">
          <span class="free">First class free</span>
          <span class="where">UK · USA · Europe</span>
        </div>
      </div>

      <div class="emblem">
        <svg viewBox="0 0 380 480" aria-hidden="true">
          <defs>
            <linearGradient id="arch" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#0B5D4B" />
              <stop offset="1" stop-color="#11332C" />
            </linearGradient>
          </defs>
          <path d="M10 480V198C10 112 96 52 190 4C284 52 370 112 370 198V480Z" fill="url(#arch)" />
          <path
            d="M34 480V202C34 128 108 76 190 34C272 76 346 128 346 202V480"
            fill="none"
            stroke="#E8CF94"
            stroke-width="3"
          />
          <path
            d="M190 96l10.4 22.1 24 3.3-17.6 16.9 4.6 24L190 151l-21.4 11.3 4.6-24-17.6-16.9 24-3.3z"
            fill="#E8CF94"
          />
          <path
            d="M110 352C142 334 168 334 190 352C212 334 238 334 270 352V404C238 386 212 386 190 404C168 386 142 386 110 404Z"
            fill="#E8CF94"
          />
          <path d="M190 352V404" stroke="#11332C" stroke-width="4" />
        </svg>
        <p class="name" lang="ar" dir="rtl">معلّم الفرقان</p>
      </div>
    </main>
  </body>
</html>
